{% extends "base.html" %}
{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/fontawesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/solid.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/brands.min.css') }}">
{% endblock %}
{% block title %}Kindler Gutenberg Australia{% endblock %}
{% block body_attrs %} class="home"{% endblock %}
{% block content %}
<h2><i class="fa-solid fa-book"></i> Kindler Gutenberg Australia</h2>
<form action="{{ url_for('gutenberg_au.search') }}" method="get">
        <input id="input_text" type="text" class="field" name="q" placeholder="Search project Gutenberg Australia...">
        <br>
        <input type="submit" value="Search" class="btn">
    </form>
{% endblock %}
