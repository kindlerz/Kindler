<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="HandheldFriendly" content="true">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{{ title | safe }}</title>
</head>
<body>
    <div class="top-nav">
        <a href="{{ url_for('home.home') }}">Home</a>
        <form action="{{ url_for('gutenberg_au.search') }}" method="get">
            <input type="text" id="q" name="q" value="{{ query }}">
            <input type="submit" value="Search">
        </form>
    </div>
    <hr>
    <div class="source-info">
        <pre style="white-space: pre-wrap; word-wrap: break-word;">Original Source: <a href="{{ url }}">{{ url }}</a></pre>
        <p class="download-links">
            <a href="{{ url_for('gutenberg_au.save_page', id=id, format='html') }}">[.html]</a>
            <a href="{{ url_for('gutenberg_au.save_page', id=id, format='epub') }}">[.epub]</a>
            <a href="{{ url_for('gutenberg_au.save_page', id=id, format='mobi') }}">[.mobi]</a>
            <a href="{{ url_for('gutenberg_au.save_page', id=id, format='azw3') }}">[.azw3]</a>
        </p>
    </div>
    {% if direct %}
        <div class="content">
            {{ content | safe }}
        </div>
    {% else %}
        <h1 class="h1-ebook">{{ title }}</h1>
        <h2 class="h2-ebook">by {{ author }}</h2>
        <p>{{ summary }} (This is an automatically generated summary.)</p>
    {% endif %}
</body>
</html>
