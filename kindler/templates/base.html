<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="HandheldFriendly" content="true">
    <link rel="shortcut icon" href="/favicon.ico">
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- E-ink contrast tweaks: remove this line to disable -->
    <link rel="stylesheet" href="{{ url_for('static', filename='eink.css') }}">
    <!-- Dark mode (only for prefers-color-scheme: dark): remove this line to disable -->
    <link rel="stylesheet" href="{{ url_for('static', filename='dark.css') }}">
    <!--[if lte IE 7]><link rel="stylesheet" href="{{ url_for('static', filename='ie.css') }}"><![endif]-->
    <title>{% block title %}{% endblock %}</title>
</head>
<body{% block body_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</body>
</html>
