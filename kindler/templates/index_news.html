{% extends "base.html" %}
{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/fontawesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/solid.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/brands.min.css') }}">
{% endblock %}
{% block title %}Kindler News{% endblock %}
{% block body_attrs %} class="home"{% endblock %}
{% block content %}
<h2><i class="fa-solid fa-newspaper"></i> Kindler News</h2>
<form action="{{ url_for('news.search') }}" method="get">
    <select class="drop-down" id="news-category" name="news-category">
        {% set options = [('top', 'World Top News'), ('usa-en', 'USA'),
        ('germany-de', 'Germany (DE)'), ('technology', 'Technology'),
        ('business','Business')] %}
        {% for value, label in options %}
            <option value="{{ value }}">
                {{ label }}
            </option>
        {% endfor %}
    </select>
    <br>
    <input type="submit" value="Get News" class="btn">
</form>
{% endblock %}
